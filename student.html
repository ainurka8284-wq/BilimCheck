<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BilimCheck - Тест тапшыруу</title>
    <style>
        /* Окуучунун панели үчүн кооз жана заманбап кара түстөгү стилдер */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .quiz-container {
            background-color: #1e293b;
            max-width: 650px;
            width: 100%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            box-sizing: border-box;
        }
        h2, h3 {
            color: #38bdf8;
            margin-top: 0;
        }
        .input-group {
            margin: 20px 0;
        }
        .input-group input {
            width: 100%;
            padding: 14px;
            background-color: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        .input-group input:focus {
            border-color: #38bdf8;
        }
        .btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        .question-block {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 15px;
            color: #f1f5f9;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-label {
            display: flex;
            align-items: center;
            background-color: #1e293b;
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #475569;
            transition: background 0.2s;
        }
        .option-label:hover {
            background-color: #334155;
        }
        .option-label input {
            margin-right: 12px;
            transform: scale(1.2);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="auth-block">
        <h2>Ассалому алейкум!</h2>
        <p style="color: #94a3b8; font-size: 15px;">Тестти баштоо үчүн сураныч атыңызды жана фамилияңызды толук жазыңыз:</p>
        <div class="input-group">
            <input type="text" id="student-name" placeholder="Мисалы: Асанов Ислам">
        </div>
        <button class="btn" id="btn-start">ТЕСТТИ БАШТОО</button>
    </div>

    <div class="quiz-container" id="quiz-block" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 15px; margin-bottom: 20px;">
            <h3 id="quiz-title" style="margin: 0;">Тест жүктөлүүдө...</h3>
            <div id="cheat-counter" style="color: #fbbf24; font-weight: bold; background: #78350f; padding: 5px 10px; border-radius: 6px; font-size: 14px;">Чыгуулар: 0</div>
        </div>
        
        <div id="questions-container"></div>

        <button class="btn" id="btn-submit" style="background: #10b981; margin-top: 10px;">ЖЫЙЫНТЫКТЫ ЖӨНӨТҮҮ</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // Firebase конфигурациясы
        const firebaseConfig = {
            apiKey: "AIzaSyAW4ztx5zqry9vLPIGTZGcf1eTCxWcQnqI",
            authDomain: "bilimchek.firebaseapp.com",
            databaseURL: "https://bilimchek-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bilimchek",
            storageBucket: "bilimchek.firebasestorage.app",
            messagingSenderId: "214598424733",
            appId: "1:214598424733:web:3775772e9c37662ed05c74"
        };

        // Firebase'ди иштетүү
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        // URL даректен тесттин ID кодун таап алуу
        const urlParams = new URLSearchParams(window.location.search);
        const testId = urlParams.get('test');

        const authBlock = document.getElementById('auth-block');
        const quizBlock = document.getElementById('quiz-block');
        const btnStart = document.getElementById('btn-start');
        const studentNameInput = document.getElementById('student-name');
        const quizTitle = document.getElementById('quiz-title');
        const questionsContainer = document.getElementById('questions-container');
        
        let studentName = "";
        let testName = "";
        let cheatCount = 0;
        let isQuizStarted = false;
        let resultRef = null; 
        let loadedQuestions = {}; // Базадан жүктөлгөн суроолорду сактоочу объект

        // 1. ТЕСТТИН АБАЛЫН ЖАНА СУРООЛОРУН БАЗАДАН ТЕКШЕРҮҮ
        if (testId) {
            database.ref('tests/' + testId).once('value', (snapshot) => {
                const testData = snapshot.val();
                if (testData) {
                    testName = testData.name;
                    quizTitle.innerText = testName;
                    
                    // Эгер мугалим тестти жаап койгон болсо киргизбейт
                    if (testData.status === "жабык") {
                        alert("Бул тест азыр жабык! Мугалим ачмайынча кирүүгө мүмкүн эмес.");
                        btnStart.disabled = true;
                        return;
                    }

                    // Суроолорду эстеп калуу
                    if (testData.questions) {
                        loadedQuestions = testData.questions;
                    }
                } else {
                    alert("Ката: Мындай тест табылган жок!");
                    btnStart.disabled = true;
                }
            });
        } else {
            alert("Тесттин шилтемеси туура эмес же ID көрсөтүлгөн эмес!");
            btnStart.disabled = true;
        }

        // 2. ТЕСТТИ БАШТОО
        btnStart.addEventListener('click', () => {
            studentName = studentNameInput.value.trim();
            if (!studentName) {
                alert("Сураныч, атыңызды жана фамилияңызды жазыңыз!");
                return;
            }

            if (Object.keys(loadedQuestions).length === 0) {
                alert("Бул тестте азырынча суроолор киргизиле элек. Мугалим суроо кошуусу зарыл!");
                return;
            }

            authBlock.style.display = "none";
            quizBlock.style.display = "block";
            isQuizStarted = true;

            // Базанын 'results' папкасына окуучу башталганы тууралуу маалымат коопсуз жазылат
            resultRef = database.ref('results').push();
            resultRef.set({
                studentName: studentName,
                testName: testName,
                score: "Иштеп жатат...",
                status: "Таza"
            });

            // Суроолорду экранга кооздоп чыгаруу
            displayQuestions();
        });

        // 3. БАЗАДАН КЕЛГЕН СУРООЛОРДУ ЭКРАНГА ЧЫГАРУУ ФУНКЦИЯСЫ
        function displayQuestions() {
            questionsContainer.innerHTML = "";
            let number = 1;

            Object.keys(loadedQuestions).forEach((qKey) => {
                const q = loadedQuestions[qKey];
                const qBlock = document.createElement('div');
                qBlock.className = 'question-block';
                
                // Суроонун түзүлүшү
                qBlock.innerHTML = `
                    <p class="question-text">${number}. ${q.text}</p>
                    <div class="options-container">
                        <label class="option-label"><input type="radio" name="${qKey}" value="A"> A) ${q.options.A}</label>
                        <label class="option-label"><input type="radio" name="${qKey}" value="B"> B) ${q.options.B}</label>
                        <label class="option-label"><input type="radio" name="${qKey}" value="C"> C) ${q.options.C}</label>
                        <label class="option-label"><input type="radio" name="${qKey}" value="D"> D) ${q.options.D}</label>
                    </div>
                `;
                questionsContainer.appendChild(qBlock);
                number++;
            });
        }

        // 4. КООПСУЗДУК СИСТЕМАСЫ (Браузерден башка терезеге өткөндө аныктоо)
        window.addEventListener('blur', () => {
            if (isQuizStarted && resultRef) {
                cheatCount++;
                document.getElementById('cheat-counter').innerText = "Чыгуулар: " + cheatCount;
                
                let currentStatus = "Чыкты: " + cheatCount;
                if (cheatCount >= 3) {
                    currentStatus = "Бөгөт!";
                    alert("Сиз 3 жолу башка терезеге өткөнүңүз үчүн тест автоматтык түрдө бөгөттөлдү! Жыйынтык 0 упай менен жөнөтүлөт.");
                    finishQuiz(true); // Тестти автоматтык түрдө жабуу
                } else {
                    resultRef.update({ status: currentStatus });
                }
            }
        });

        // 5. ТЕСТТИ АЯКТОО ЖАНА УПАЙДЫ ЭСЕПТӨӨ
        document.getElementById('btn-submit').addEventListener('click', () => {
            if (confirm("Тестти аяктап, жыйынтыгын мугалимге жөнөтүүнү каалайсызбы?")) {
                finishQuiz(false);
            }
        });

        function finishQuiz(isBlocked) {
            if (!isQuizStarted) return;
            isQuizStarted = false;

            let totalQuestions = Object.keys(loadedQuestions).length;
            let correctAnswersCount = 0;

            // Эгер бөгөттөлбөсө окуучунун жоопторун текшеребиз
            if (!isBlocked) {
                Object.keys(loadedQuestions).forEach((qKey) => {
                    const q = loadedQuestions[qKey];
                    const selectedOption = document.querySelector(`input[name="${qKey}"]:checked`);
                    
                    if (selectedOption && selectedOption.value === q.correct) {
                        correctAnswersCount++;
                    }
                });
            }

            // Упай форматы (Мисалы: 12/15)
            let finalScore = isBlocked ? `0/${totalQuestions}` : `${correctAnswersCount}/${totalQuestions}`;
            let finalStatus = cheatCount > 0 ? (cheatCount >= 3 ? "Бөгөт!" : "Чыкты: " + cheatCount) : "Таза";

            // Маалыматты Firebase'ге коопсуз жөнөтүү
            resultRef.update({
                score: finalScore,
                status: finalStatus
            }).then(() => {
                alert(`Тест аяктады!\nСиздин жыйынтык: ${finalScore}\nМугалимдин панелине ийгиликтүү катталды.`);
                // Баракты баштапкы абалга келтирүү
                window.location.reload();
            });
        }
    </script>
</body>
</html>
