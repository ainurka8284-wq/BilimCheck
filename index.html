<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BilimCheck - Мугалимдин панели</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
</head>
<body>

    <header class="header">
        <div class="logo">BILIM<span>CHECK</span> <span class="badge">панель</span></div>
        <div class="nav-buttons">
            <button id="btn-excel" class="btn btn-excel">+ EXCEL ЖҮКТӨӨ</button>
            <button id="btn-create-test" class="btn btn-create">+ ЖАҢЫ ТЕСТ ТҮЗҮҮ</button>
        </div>
    </header>

    <main class="main-container">
        <section class="card section-my-tests">
            <h3>📂 МЕНИН ТЕСТТЕРИМ</h3>
            <div id="tests-list" class="tests-list">
                <div class="loading">Тесттер жүктөлүүдө...</div>
            </div>
        </section>

        <section class="card section-results">
            <h3>📊 ОКУУЧУЛАРДЫН ЖЫЙЫНТЫКТАРЫ (РЕАЛДУУ УБАКЫТ)</h3>
            <button id="btn-clear" class="btn-clear">Тазалоо</button>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ОКУУЧУ</th>
                            <th>ТЕСТТИН АТАЛЫШЫ</th>
                            <th>УПАЙ (БАА)</th>
                            <th>КООПСУЗДУК АБАЛЫ</th>
                        </tr>
                    </thead>
                    <tbody id="results-table-body">
                        <tr>
                            <td colspan="4" class="status-msg">Firebase'ге туташуу күтүлүүдө...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="modal-test" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Жаңы тест түзүү</h2>
            <input type="text" id="test-title" placeholder="Тесттин аталышы (мис: 7-класс 'Жылдык')">
            <textarea id="test-questions" placeholder='Суроолорду JSON форматында же текст катары киргизиңиз...' rows="10"></textarea>
            <button id="save-test-btn" class="btn btn-create">Сактоо</button>
        </div>
    </div>

</body>
</html>
