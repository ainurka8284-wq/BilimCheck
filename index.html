<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BilimCheck - Мугалимдин панели</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="logo">BILIMCHECK <span class="panel-text">панель</span></div>
        <div class="header-buttons">
            <button class="btn btn-excel">+ EXCEL ЖҮКТӨӨ</button>
            <button class="btn btn-add">+ ЖАҢЫ ТЕСТ ТҮЗҮҮ</button>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <h3>📁 МЕНИН ТЕСТТЕРИМ</h3>
            <div id="tests-list">
                <p style="color: #9ca3af; font-size: 14px; font-style: italic;">Тесттер жүктөлүүдө...</p>
            </div>
        </aside>

        <main class="content">
            <div class="content-header">
                <h3>📊 ОКУУЧУЛАРДЫН ЖЫЙЫНТЫКТАРЫ (РЕАЛДУУ УБАКЫТ)</h3>
                <button class="btn-clean">Тазалоо</button>
            </div>

            <table class="results-table">
                <thead>
                    <tr>
                        <th>ОКУУЧУ</th>
                        <th>ТЕСТТИН АТАЛЫШЫ</th>
                        <th>УПАЙ (БАА)</th>
                        <th>КООПСУЗДУК АБАЛЫ</th>
                    </tr>
                </thead>
                <tbody id="results-list">
                    <tr>
                        <td colspan="4" style="color: #9ca3af; text-align: center; font-style: italic;">Firebase'ге туташуу күтүлүүдө...</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script src="script.js"></script>
</body>
</html>
